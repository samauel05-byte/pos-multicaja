# Blueprint de Render: servidor .NET (Docker). La base de datos es PostgreSQL de Supabase (externa).
# Render > New > Blueprint > elija este repositorio. Las contraseñas se generan y se leen en el panel (Environment).
# DATABASE_URL se pega a mano en el panel (cadena del "Session pooler" de Supabase): no va en este archivo porque lleva contraseña.
services:
  - type: web
    name: pos-api
    runtime: docker
    plan: free              # el plan gratuito se "duerme" tras inactividad y no tiene disco persistente
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false          # valor secreto: se pide al crear el servicio
      - key: Jwt__Key
        generateValue: true
      - key: Seed__Demo
        value: "true"        # datos FICTICIOS para probar; ponga "false" para un negocio real
      - key: Seed__AdminPassword
        generateValue: true
      - key: Seed__DemoPassword
        generateValue: true
      - key: Seed__DemoPin
        generateValue: true
      - key: Backup__Passphrase
        generateValue: true
      - key: Backup__AutoEnabled
        value: "false"       # sin disco persistente los respaldos locales se pierden; actívelo con un disco
